name = "esp32_application"
description = "ESP32 Application Template"
version = "0.1.0-dev"

authors = ["RREE"]
maintainers = ["RREE <rolf.ebert.gcc@gmx.de>"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "esp32"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[environment]
XTENSA_GNU_CONFIG.set = "${CRATE_ROOT}/crates/xtensa-dynconfig/xtensa-dynconfig/xtensa_esp32.so"

[[depends-on]]
a0b_base = "*"
a0b_tools = "*"
espidf_gnat_runtime = "*"
gnat_xtensa_esp32_elf = "^15"
xtensa_dynconfig = "*"

[[actions]]
type = "pre-build"
command = ["a0b-runtime",
           "--bb-runtimes=crates/bb-runtimes/",
           "--svd=crates/espidf_gnat_runtime/svd/esp32.svd",
           "--runtime-description=crates/espidf_gnat_runtime/runtime-esp32.json",
           "--no-startup"]

[[pins]]
a0b_tools = { path='crates/a0b-tools' }
xtensa_dynconfig = { path='crates/xtensa-dynconfig' }
espidf_gnat_runtime = { path='crates/espidf_gnat_runtime' }
