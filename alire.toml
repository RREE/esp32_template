name = "esp32_application"
description = "ESP32 Application Template"
version = "0.2.0-dev"

authors = ["RREE"]
maintainers = ["RREE <rolf.ebert.gcc@gmx.de>"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "esp32"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
a0b_base = "*"
a0b_tools = "*"
espidf_gnat_runtime = "*"
gnat_xtensa_esp32_elf = "^15"
xtensa_dynconfig = "*"

[[actions]]
type = "pre-build"
command = ["a0b-runtime",
           "--bb-runtimes=crates/bb-runtimes/",
           "--svd=crates/espidf_gnat_runtime/svd/esp32.svd",
           "--runtime-description=crates/espidf_gnat_runtime/runtime-esp32.json",
           "--no-startup"]
#  esp32.svd / runtime-esp32.json / the LX6 architecture branch are not
#  merged upstream yet -- this template currently depends on forks that
#  carry them (see crates/*/README or .gitmodules). Tracking PRs:
#    https://github.com/godunko/a0b-tools/pull/2
#    https://github.com/godunko/espidf_gnat_runtime/pull/3

[[pins]]
a0b_tools = { path='crates/a0b-tools' }
xtensa_dynconfig = { path='crates/xtensa-dynconfig' }
espidf_gnat_runtime = { path='crates/espidf_gnat_runtime' }
